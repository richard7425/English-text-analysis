<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexical Level Analyzer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #f5f5f3; color: #1a1a1a; font-size: 15px; line-height: 1.6; }
  #app { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 0.25rem; }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 2rem; }
  .section-label { font-size: 11px; font-weight: 600; color: #888; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
  .card { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; }
  textarea { width: 100%; min-height: 140px; resize: vertical; font-size: 14px; padding: 10px 12px; border: 0.5px solid #ccc; border-radius: 8px; background: #fff; color: #1a1a1a; line-height: 1.6; font-family: inherit; }
  textarea:focus { outline: none; border-color: #999; }
  .btn { display: inline-block; padding: 7px 16px; border: 0.5px solid #ccc; border-radius: 8px; background: transparent; color: #1a1a1a; font-size: 13px; cursor: pointer; transition: background 0.15s; font-family: inherit; }
  .btn:hover { background: #f0f0ee; }
  .btn-primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .btn-primary:hover { background: #333; }
  .btn-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 1rem 0; }
  .stat-card { background: #f5f5f3; border-radius: 8px; padding: 12px 14px; }
  .stat-val { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .stat-lbl { font-size: 11px; color: #888; margin-top: 4px; }
  .stat-sub { font-size: 11px; color: #aaa; margin-top: 2px; }

  /* WLB score card with meter */
  .wlb-card { background: #1a1a1a; color: #fff; border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
  .wlb-score { font-size: 52px; font-weight: 700; line-height: 1; }
  .wlb-right { flex: 1; min-width: 160px; }
  .wlb-badge { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .wlb-desc { font-size: 13px; color: #aaa; line-height: 1.5; }
  .wlb-formula { font-size: 11px; color: #666; margin-top: 6px; }
  .wlb-meter-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 44px; }
  .wlb-meter-track { width: 18px; height: 120px; border-radius: 9px; background: linear-gradient(to top, #C8F5D0, #FFF9C4, #FFE0B2, #FCE4EC); position: relative; border: 0.5px solid rgba(255,255,255,0.15); flex-shrink: 0; }
  .wlb-meter-needle { position: absolute; left: -5px; right: -5px; height: 3px; background: #fff; border-radius: 2px; transition: bottom 0.6s cubic-bezier(0.4,0,0.2,1); }
  .wlb-meter-labels { display: flex; flex-direction: column; justify-content: space-between; height: 120px; font-size: 9.5px; color: #888; text-align: left; line-height: 1.2; }

  .tabs { display: flex; gap: 4px; margin-bottom: 1rem; flex-wrap: wrap; border-bottom: 0.5px solid #e5e5e3; }
  .tab { padding: 7px 16px; border-radius: 8px 8px 0 0; font-size: 13px; cursor: pointer; border: 0.5px solid transparent; color: #888; background: transparent; margin-bottom: -0.5px; }
  .tab.active { border-color: #ddd; border-bottom-color: #fff; background: #fff; color: #1a1a1a; }
  .tab:hover:not(.active) { background: #f0f0ee; color: #555; }
  .panel { display: none; }
  .panel.active { display: block; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .bar-label { font-size: 13px; width: 120px; flex-shrink: 0; color: #555; }
  .bar-track { flex: 1; height: 11px; background: #f0f0ee; border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
  .bar-pct { font-size: 12px; width: 42px; text-align: right; color: #888; }
  .bar-cnt { font-size: 12px; width: 32px; text-align: right; color: #aaa; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 0.75rem 0 1rem; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #666; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .annotated { line-height: 2.3; font-size: 15px; word-spacing: 2px; }
  .annotated span.w { border-radius: 3px; padding: 1px 4px; cursor: default; }
  .export-bar { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
  .export-label { font-size: 12px; color: #888; margin-right: 2px; }
  .wl-section { margin-bottom: 1.5rem; }
  .wl-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  table.wl-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.wl-table th { text-align: left; font-weight: 500; font-size: 11px; color: #888; padding: 6px 8px; border-bottom: 0.5px solid #e5e5e3; text-transform: uppercase; letter-spacing: 0.04em; }
  table.wl-table td { padding: 5px 8px; border-bottom: 0.5px solid #f0f0ee; color: #1a1a1a; vertical-align: top; }
  table.wl-table tr:last-child td { border-bottom: none; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 9px 20px; border-radius: 8px; font-size: 13px; z-index: 2000; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  canvas#ggplot-canvas { width: 100%; border: 0.5px solid #ddd; border-radius: 8px; display: block; }
  #results { display: none; }
  .file-status { font-size: 13px; color: #888; }
  .file-status.loaded { color: #3B6D11; }

  /* Level toggles */
  .toggle-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 0.75rem; }
  .toggle-chip { display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1.5px solid transparent; user-select: none; transition: opacity 0.15s; }
  .toggle-chip input[type=checkbox] { display: none; }
  .toggle-chip.off { opacity: 0.35; }
</style>
</head>
<body>
<div id="app">
  <h1>Lexical Level Analyzer</h1>
  <p class="subtitle">Paste a text and analyze word-level distribution based on your custom word list.</p>

  <div class="card" style="padding:0.85rem 1.5rem;display:flex;align-items:center;gap:10px">
    <div style="width:10px;height:10px;border-radius:50%;background:#3B6D11;flex-shrink:0"></div>
    <span class="file-status loaded" id="csv-status">Loading word list…</span>
  </div>

  <div class="card">
    <div class="section-label">Text to analyze</div>
    <textarea id="text-input" placeholder="Paste English text here…"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="analyze()">Analyze text</button>
      <button class="btn" onclick="clearAll()">Clear</button>
      <span id="word-count" style="font-size:13px;color:#888"></span>
    </div>
  </div>

  <div id="results">

    <!-- WLB Score Card -->
    <div class="wlb-card" id="wlb-card">
      <div class="wlb-score" id="wlb-score">—</div>
      <div class="wlb-right">
        <div class="wlb-badge" id="wlb-badge"></div>
        <div class="wlb-desc" id="wlb-desc"></div>
        <div class="wlb-formula" id="wlb-formula"></div>
      </div>
      <div class="wlb-meter-wrap">
        <div style="font-size:9px;color:#555;letter-spacing:0.04em;text-transform:uppercase">Score</div>
        <div style="display:flex;align-items:stretch;gap:5px">
          <div class="wlb-meter-labels" id="meter-labels">
            <span>Specialized<br>≥350</span>
            <span>Advanced<br>≤350</span>
            <span>Inter.<br>≤250</span>
            <span>Easy<br>≤150</span>
          </div>
          <div class="wlb-meter-track">
            <div class="wlb-meter-needle" id="wlb-needle" style="bottom:0%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Level toggles -->
    <div class="card">
      <div class="section-label" style="margin-bottom:10px">Toggle levels</div>
      <div class="toggle-row" id="toggle-row"></div>
      <div style="font-size:11px;color:#aaa;margin-top:4px">Untick a level to exclude it from the analysis and chart.</div>
    </div>

    <!-- Stat cards -->
    <div class="card">
      <div class="section-label">Breakdown</div>
      <div class="stat-grid" id="stat-grid"></div>
    </div>

    <div class="card" style="padding-bottom:1.5rem">
      <div class="tabs" id="tab-bar"></div>

      <div id="panel-breakdown" class="panel active">
        <div id="bar-chart" style="margin-top:0.5rem"></div>
      </div>

      <div id="panel-chart" class="panel">
        <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
          <button class="btn" onclick="exportChartPNG()">Download PNG</button>
        </div>
        <canvas id="ggplot-canvas"></canvas>
      </div>

      <div id="panel-annotated" class="panel">
        <div class="legend" id="legend"></div>
        <div class="annotated" id="annotated-text"></div>
      </div>

      <div id="panel-words" class="panel">
        <div class="export-bar">
          <span class="export-label">Export:</span>
          <button class="btn" onclick="exportTXT()">Copy plain text</button>
          <button class="btn" onclick="exportCSVWords()">Download CSV</button>
        </div>
        <div id="word-list-content"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ── Color scheme ─────────────────────────────────────────────────
const LEVEL_COLORS = {
  '1': { bg: '#FFF9C4', border: '#F9A825', chart: '#F9A825' },
  '2': { bg: '#C8F5D0', border: '#2E7D32', chart: '#43A047' },
  '3': { bg: '#B2EBF2', border: '#00838F', chart: '#00ACC1' },
  '4': { bg: '#FFE0B2', border: '#E65100', chart: '#FB8C00' },
  '5': { bg: '#FCE4EC', border: '#AD1457', chart: '#E91E8C' },
  '6': { bg: '#EDE7F6', border: '#4527A0', chart: '#7B1FA2' },
};
const EXTRA_COLOR = { bg: '#F0F0EE', border: '#AAAAAA', chart: '#AAAAAA' };

function getLevelKey(lvl) { return lvl.replace(/\D/g, '') || lvl; }
function getColor(lvl) {
  if (lvl === '__extra__') return EXTRA_COLOR;
  return LEVEL_COLORS[getLevelKey(lvl)] || { bg: '#E8E8E8', border: '#999', chart: '#999' };
}

// ── WLB weights ──────────────────────────────────────────────────
function getLevelNum(lvl) {
  if (lvl === '__extra__') return 0;
  return parseInt(getLevelKey(lvl)) || 0;
}
function baseWeight(lvlNum) {
  if (lvlNum <= 0) return 5;
  if (lvlNum <= 2) return 0;
  if (lvlNum <= 4) return 3;
  return 8;
}

// ── State ─────────────────────────────────────────────────────────
let wordMap = {}, wordOriginalCase = {}, levels = [], csvLoaded = false, lastAnalysis = null;
let disabledLevels = new Set();

// ── CSV parsing (RFC-4180 aware) ──────────────────────────────────
function parseCSVLine(line) {
  const result = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuotes && line[i+1] === '"') { cur += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (ch === ',' && !inQuotes) {
      result.push(cur); cur = '';
    } else {
      cur += ch;
    }
  }
  result.push(cur);
  return result;
}

function parseCSV(text) {
  wordMap = {}; wordOriginalCase = {}; levels = [];
  const lines = text.trim().split('\n'), levelSet = new Set();
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim(); if (!line) continue;
    const parts = parseCSVLine(line); if (parts.length < 2) continue;
    const lvl = parts[0].trim();
    const wordRaw = parts[1].trim();
    const wordLower = wordRaw.toLowerCase();
    const trans = parts.slice(2).join(',').trim();
    if (!lvl || !wordLower) continue;
    if (i === 0 && (wordLower === 'word' || lvl.toLowerCase().startsWith('level'))) continue;
    // Store mapping: lowercase → level/translation; original case for display
    wordMap[wordLower] = { level: lvl, translation: trans };
    // Keep the original casing if it differs from lowercase (proper nouns, abbrevs)
    if (wordRaw !== wordLower) wordOriginalCase[wordLower] = wordRaw;
    levelSet.add(lvl);
  }
  levels = [...levelSet].sort((a, b) => {
    const na = parseInt(a.replace(/\D/g,'')), nb = parseInt(b.replace(/\D/g,''));
    return (!isNaN(na) && !isNaN(nb)) ? na - nb : a.localeCompare(b);
  });
  return Object.keys(wordMap).length;
}

// ── Lemmatization ─────────────────────────────────────────────────
const IRREGULAR = {
  'am':'be','is':'be','are':'be','was':'be','were':'be','been':'be','being':'be',
  'has':'have','had':'have','having':'have','does':'do','did':'do','done':'do','doing':'do',
  'went':'go','goes':'go','gone':'go','going':'go','said':'say','says':'say',
  'made':'make','makes':'make','making':'make','took':'take','takes':'take','taken':'take','taking':'take',
  'came':'come','comes':'come','coming':'come','got':'get','gets':'get','gotten':'get','getting':'get',
  'knew':'know','knows':'know','known':'know','thought':'think','thinks':'think','thinking':'think',
  'brought':'bring','brings':'bring','bought':'buy','buys':'buy',
  'caught':'catch','catches':'catch','found':'find','finds':'find',
  'gave':'give','gives':'give','given':'give','giving':'give',
  'saw':'see','sees':'see','seen':'see','seeing':'see',
  'told':'tell','tells':'tell','felt':'feel','feels':'feel',
  'left':'leave','kept':'keep','keeps':'keep',
  'met':'meet','meets':'meet','ran':'run','runs':'run',
  'sat':'sit','sits':'sit','stood':'stand','stands':'stand',
  'wore':'wear','wears':'wear','worn':'wear',
  'wrote':'write','writes':'write','written':'write',
  'read':'read','reads':'read','lost':'lose','loses':'lose',
  'led':'lead','leads':'lead','grew':'grow','grows':'grow','grown':'grow',
  'began':'begin','begins':'begin','begun':'begin',
  'broke':'break','breaks':'break','broken':'break',
  'chose':'choose','chooses':'choose','chosen':'choose',
  'drove':'drive','drives':'drive','driven':'drive',
  'flew':'fly','flies':'fly','flown':'fly','held':'hold','holds':'hold',
  'heard':'hear','hears':'hear','paid':'pay','pays':'pay',
  'put':'put','sent':'send','sends':'send','set':'set','sets':'set',
  'spent':'spend','spends':'spend','taught':'teach','teaches':'teach',
  'understood':'understand','won':'win','wins':'win',
  'women':'woman','men':'man','children':'child','feet':'foot','teeth':'tooth',
  'mice':'mouse','geese':'goose','lives':'life','wives':'wife',
  'knives':'knife','leaves':'leaf','halves':'half','wolves':'wolf',
  'better':'good','best':'good','worse':'bad','worst':'bad',
};

function lemmatize(word) {
  const w = word.toLowerCase();
  if (wordMap[w]) return w;
  if (IRREGULAR[w]) return IRREGULAR[w];
  if (w.endsWith('ing')) { const s = w.slice(0,-3); if (wordMap[s]) return s; if (wordMap[s+'e']) return s+'e'; if (s.length>2 && s[s.length-1]===s[s.length-2] && wordMap[s.slice(0,-1)]) return s.slice(0,-1); }
  if (w.endsWith('ed'))  { const s = w.slice(0,-2); if (wordMap[s]) return s; if (wordMap[s+'e']) return s+'e'; if (s.length>2 && s[s.length-1]===s[s.length-2] && wordMap[s.slice(0,-1)]) return s.slice(0,-1); if (wordMap[w.slice(0,-1)]) return w.slice(0,-1); }
  if (w.endsWith('ies') && wordMap[w.slice(0,-3)+'y']) return w.slice(0,-3)+'y';
  if (w.endsWith('es'))  { if (wordMap[w.slice(0,-2)]) return w.slice(0,-2); if (wordMap[w.slice(0,-1)]) return w.slice(0,-1); }
  if (w.endsWith('s') && !w.endsWith('ss') && wordMap[w.slice(0,-1)]) return w.slice(0,-1);
  if (w.endsWith('er'))  { const s = w.slice(0,-2); if (wordMap[s]) return s; if (wordMap[s+'e']) return s+'e'; }
  if (w.endsWith('est')) { const s = w.slice(0,-3); if (wordMap[s]) return s; if (wordMap[s+'e']) return s+'e'; }
  if (w.endsWith('ly') && wordMap[w.slice(0,-2)]) return w.slice(0,-2);
  return null;
}

// Get display form of lemma: use stored original casing if available
function lemmaDisplay(lemma) {
  return wordOriginalCase[lemma] || lemma;
}

function tokenize(text) {
  const tokens = [], re = /([a-zA-Z]+(?:[-'][a-zA-Z]+)*)|([^a-zA-Z]+)/g; let m;
  while ((m = re.exec(text)) !== null) tokens.push(m[1] ? {text:m[1],isWord:true} : {text:m[2],isWord:false});
  return tokens;
}

document.getElementById('text-input').addEventListener('input', function() {
  const words = tokenize(this.value).filter(t => t.isWord);
  document.getElementById('word-count').textContent = words.length ? `${words.length} words` : '';
});

// ── Toggle chips ──────────────────────────────────────────────────
function buildToggles() {
  const row = document.getElementById('toggle-row');
  const allKeys = [...levels, '__extra__'];
  const allLabels = [...levels.map(l => `Level ${l.replace(/level\s*/i,'')||l}`), 'Extracurricular'];
  row.innerHTML = allKeys.map((key, i) => {
    const c = getColor(key);
    const checked = !disabledLevels.has(key);
    return `<label class="toggle-chip${checked?'':' off'}" id="chip-${key}" style="background:${c.bg};border-color:${c.border}">
      <input type="checkbox" ${checked?'checked':''} onchange="toggleLevel('${key}',this)">
      <span>${allLabels[i]}</span>
    </label>`;
  }).join('');
}

function toggleLevel(key, cb) {
  if (cb.checked) disabledLevels.delete(key);
  else disabledLevels.add(key);
  document.getElementById(`chip-${key}`).classList.toggle('off', !cb.checked);
  if (lastAnalysis) recomputeAndRefresh();
}

// ── Main analysis ─────────────────────────────────────────────────
function analyze() {
  if (!csvLoaded) { alert('Please load a CSV word list first.'); return; }
  const text = document.getElementById('text-input').value.trim();
  if (!text) { alert('Please paste some text to analyze.'); return; }
  const tokens = tokenize(text), wordTokens = tokens.filter(t => t.isWord);
  if (!wordTokens.length) { alert('No words found.'); return; }

  const levelCounts = {}; levels.forEach(l => levelCounts[l] = 0); levelCounts['__extra__'] = 0;

  const tokenInfo = tokens.map(t => {
    if (!t.isWord) return {...t, level:null, lemma:null, translation:''};
    const lemma = lemmatize(t.text);
    if (lemma && wordMap[lemma]) {
      const {level, translation} = wordMap[lemma];
      levelCounts[level] = (levelCounts[level] || 0) + 1;
      return {...t, level, lemma, translation};
    } else {
      levelCounts['__extra__']++;
      return {...t, level:'__extra__', lemma:t.text.toLowerCase(), translation:''};
    }
  });

  lastAnalysis = { tokenInfo, levelCounts: {...levelCounts}, levels: [...levels] };
  disabledLevels = new Set(); // reset toggles on fresh analysis
  document.getElementById('results').style.display = 'block';
  buildToggles();
  recomputeAndRefresh();
  // Build tabs once
  document.getElementById('tab-bar').innerHTML = [
    {id:'breakdown', label:'Level breakdown'},
    {id:'chart',     label:'ggplot chart'},
    {id:'annotated', label:'Annotated text'},
    {id:'words',     label:'Word list'},
  ].map((t,i) => `<div class="tab${i===0?' active':''}" onclick="switchTab('${t.id}')">${t.label}</div>`).join('');
  switchTab('breakdown');
}

// ── Recompute WLB + refresh all panels based on active toggles ────
function recomputeAndRefresh() {
  const { tokenInfo, levelCounts, levels } = lastAnalysis;
  const allKeys   = [...levels, '__extra__'];
  const allLabels = [...levels.map(l => `Level ${l.replace(/level\s*/i,'')||l}`), 'Extracurricular'];

  // Effective counts (disabled levels → 0 for WLB, still shown greyed in chart)
  const activeCounts = {};
  allKeys.forEach(k => activeCounts[k] = disabledLevels.has(k) ? 0 : (levelCounts[k] || 0));

  const total = Object.values(activeCounts).reduce((s,v) => s+v, 0);

  // WLB with tolerance grace
  let graceRemaining = 4, weightedSum = 0, graceUsed = 0;
  const tokenInfoCopy = tokenInfo.map(t => ({...t, _graced: false}));
  tokenInfoCopy.filter(t => t.isWord && t.level && !disabledLevels.has(t.level)).forEach(t => {
    const lvlNum = getLevelNum(t.level);
    let w;
    if (t.level === '__extra__') { w = 15; }
    else if (lvlNum >= 5 && graceRemaining > 0) { w = 3; graceRemaining--; graceUsed++; t._graced = true; }
    else { w = baseWeight(lvlNum); }
    weightedSum += w;
  });

  const wlbScore  = total > 0 ? (weightedSum / total) * 100 : 0;
  const wlbRounded = Math.round(wlbScore * 10) / 10;

  let wlbLabel, wlbDesc, wlbBadgeStyle;
  if (wlbRounded <= 150)      { wlbLabel='Easy';         wlbDesc='Suitable for all audiences.';         wlbBadgeStyle='background:#C8F5D0;color:#1B5E20'; }
  else if (wlbRounded <= 250) { wlbLabel='Intermediate'; wlbDesc='Standard academic difficulty.';       wlbBadgeStyle='background:#FFF9C4;color:#795500'; }
  else if (wlbRounded <= 350) { wlbLabel='Advanced';     wlbDesc='Dense — requires strong vocabulary.'; wlbBadgeStyle='background:#FFE0B2;color:#BF360C'; }
  else                         { wlbLabel='Specialized';  wlbDesc='Highly specialized vocabulary.';     wlbBadgeStyle='background:#FCE4EC;color:#880E4F'; }

  document.getElementById('wlb-score').textContent = wlbRounded.toFixed(1);
  document.getElementById('wlb-badge').textContent = wlbLabel;
  document.getElementById('wlb-badge').style.cssText = wlbBadgeStyle;
  document.getElementById('wlb-desc').textContent = wlbDesc;
  const graceNote = graceUsed > 0 ? ` (${graceUsed} advanced word${graceUsed>1?'s':''} covered by tolerance grace)` : '';
  document.getElementById('wlb-formula').textContent = `Score = (${weightedSum} weighted pts ÷ ${total} words) × 100 = ${wlbRounded.toFixed(1)}${graceNote}`;

  // Meter needle: clamp score 0–400, map to 0–100% bottom
  const meterPct = Math.min(Math.max(wlbRounded / 400, 0), 1) * 100;
  document.getElementById('wlb-needle').style.bottom = meterPct + '%';

  // Stat cards
  let cF=0, cU=0, cA=0, cE=0;
  levels.forEach(l => {
    const n=getLevelNum(l), c=activeCounts[l]||0;
    if(n<=2) cF+=c; else if(n<=4) cU+=c; else cA+=c;
  });
  cE = activeCounts['__extra__']||0;
  const covPct = total>0 ? (total-cE)/total*100 : 0;

  document.getElementById('stat-grid').innerHTML = `
    <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-lbl">Total words</div></div>
    <div class="stat-card"><div class="stat-val">${covPct.toFixed(1)}%</div><div class="stat-lbl">In word list</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#F9A825">${cF}</div><div class="stat-lbl">L1–2 Foundational</div><div class="stat-sub">weight × 0</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#00ACC1">${cU}</div><div class="stat-lbl">L3–4 University</div><div class="stat-sub">weight × 3</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#7B1FA2">${cA}${graceUsed>0?' ('+graceUsed+' graced)':''}</div><div class="stat-lbl">L5–6 Advanced</div><div class="stat-sub">weight × 8 (first 4 → ×3)</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#AAAAAA">${cE}</div><div class="stat-lbl">Extracurricular</div><div class="stat-sub">weight × 5</div></div>
  `;

  // Bar chart
  let bars = '';
  allKeys.forEach((key, i) => {
    const cnt = activeCounts[key]||0, pct = total>0 ? cnt/total*100 : 0;
    const c = getColor(key);
    const dimmed = disabledLevels.has(key) ? 'opacity:0.3;' : '';
    bars += `<div class="bar-row" style="${dimmed}">
      <span class="bar-label">${allLabels[i]}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct.toFixed(1)}%;background:${c.chart}"></div></div>
      <span class="bar-pct">${pct.toFixed(1)}%</span>
      <span class="bar-cnt">${cnt}</span>
    </div>`;
  });
  document.getElementById('bar-chart').innerHTML = bars;

  // Legend
  document.getElementById('legend').innerHTML = allKeys.map((k,i) => {
    const c=getColor(k), dim=disabledLevels.has(k)?'opacity:0.35;':'';
    return `<div class="legend-item" style="${dim}"><div class="legend-dot" style="background:${c.bg};border:1.5px solid ${c.border}"></div>${allLabels[i]}</div>`;
  }).join('');

  // Annotated text
  let html = '';
  tokenInfoCopy.forEach(t => {
    if (!t.isWord) { html += t.text.replace(/\n/g, '<br>'); }
    else if (t.level) {
      const disabled = disabledLevels.has(t.level);
      const c = disabled ? {bg:'#f0f0ee', border:'#ccc'} : getColor(t.level);
      const label = t.level==='__extra__' ? 'Extracurricular' : t.level;
      const lvlNum = getLevelNum(t.level);
      const dispLemma = lemmaDisplay(t.lemma);
      let tipExtra = t._graced ? ' [tolerance grace applied: counted as L4]' : '';
      const tip = t.level==='__extra__'
        ? `Extracurricular · weight ×15${disabled?' [excluded]':''}`
        : `${label} · ${dispLemma}${t.translation?' · '+t.translation:''} · weight ×${baseWeight(lvlNum)}${tipExtra}${disabled?' [excluded]':''}`; 
      const marker = t._graced ? '<sup style="font-size:9px;color:#AD1457;margin-left:1px">✦</sup>' : '';
      html += `<span class="w" style="background:${c.bg};border-bottom:2px solid ${c.border};${disabled?'opacity:0.35;':''}" title="${tip.replace(/"/g,'&quot;')}">${t.text}${marker}</span>`;
    } else { html += t.text; }
  });
  document.getElementById('annotated-text').innerHTML = html;

  // Word list
  const byLevel = {};
  allKeys.forEach(k => byLevel[k] = new Map());
  tokenInfoCopy.filter(t => t.isWord && t.level).forEach(t => {
    if (!byLevel[t.level].has(t.lemma)) byLevel[t.level].set(t.lemma, t.translation);
  });
  let wlHtml = '';
  allKeys.forEach((key, i) => {
    const map = byLevel[key]; if (!map.size) return;
    const c = getColor(key);
    const lvlNum = getLevelNum(key);
    const weightLabel = key==='__extra__' ? '×5' : `×${baseWeight(lvlNum)}`;
    const dimmed = disabledLevels.has(key) ? 'opacity:0.4;' : '';
    const words = [...map.entries()].sort((a,b) => a[0].localeCompare(b[0]));
    wlHtml += `<div class="wl-section" style="${dimmed}">
      <div class="wl-header">
        <span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${c.bg};border:1.5px solid ${c.border}"></span>
        <span style="font-size:13px;font-weight:600">${allLabels[i]}</span>
        <span style="font-size:11px;color:#aaa;background:#f5f5f3;padding:2px 7px;border-radius:4px">weight ${weightLabel}</span>
        <span style="font-size:12px;color:#888">${map.size} unique words</span>
      </div>
      <table class="wl-table">
        <thead><tr><th>#</th><th>Word (lemma)</th><th>Translation</th></tr></thead>
        <tbody>${words.map(([w,tr],n) => `<tr><td style="color:#aaa">${n+1}</td><td><strong>${lemmaDisplay(w)}</strong></td><td style="color:#666">${tr||'—'}</td></tr>`).join('')}</tbody>
      </table>
    </div>`;
  });
  document.getElementById('word-list-content').innerHTML = wlHtml;

  // ggplot
  setTimeout(() => drawGGPlot(allKeys, allLabels, activeCounts), 60);
}

// ── ggplot chart ──────────────────────────────────────────────────
function drawGGPlot(allKeys, allLabels, levelCounts) {
  const canvas = document.getElementById('ggplot-canvas');
  const W = canvas.parentElement.offsetWidth || 700;
  const H = Math.round(W * 0.52);
  canvas.width = W*2; canvas.height = H*2;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(2,2);

  const pad = {top:44, right:32, bottom:62, left:62};
  const pw = W-pad.left-pad.right, ph = H-pad.top-pad.bottom;

  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);

  const counts = allKeys.map(k => levelCounts[k]||0);
  const maxCount = Math.max(...counts, 1);
  const nGridY = 5;

  ctx.strokeStyle='#e8e8e6'; ctx.lineWidth=0.6;
  for (let i=0; i<=nGridY; i++) {
    const y = pad.top+ph-(i/nGridY)*ph;
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(pad.left+pw,y); ctx.stroke();
  }
  ctx.strokeStyle='#444'; ctx.lineWidth=0.8;
  ctx.strokeRect(pad.left,pad.top,pw,ph);

  const gap = pw/allKeys.length;
  const barW = Math.min(gap*0.55, 52);

  allKeys.forEach((key,i) => {
    const cnt = counts[i];
    const bh = cnt/maxCount*ph;
    const x = pad.left+gap*i+gap/2-barW/2;
    const y = pad.top+ph-bh;
    ctx.globalAlpha = disabledLevels.has(key) ? 0.2 : 1;
    ctx.fillStyle = getColor(key).chart;
    ctx.fillRect(x, y, barW, bh);
    ctx.globalAlpha = 1;
    if (cnt > 0) {
      ctx.fillStyle = disabledLevels.has(key) ? '#bbb' : '#333';
      ctx.font='500 10.5px sans-serif'; ctx.textAlign='center';
      ctx.fillText(cnt, x+barW/2, y-5);
    }
  });

  ctx.fillStyle='#555'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  allKeys.forEach((key,i) => {
    const x = pad.left+gap*i+gap/2;
    ctx.globalAlpha = disabledLevels.has(key) ? 0.35 : 1;
    ctx.fillText(allLabels[i].replace('Level ','L'), x, pad.top+ph+18);
    ctx.globalAlpha = 1;
  });

  ctx.textAlign='right'; ctx.fillStyle='#666'; ctx.font='11px sans-serif';
  for (let i=0; i<=nGridY; i++) {
    const val = Math.round(maxCount*i/nGridY);
    const y = pad.top+ph-(i/nGridY)*ph;
    ctx.fillText(val, pad.left-8, y+4);
    ctx.strokeStyle='#777'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(pad.left-4,y); ctx.lineTo(pad.left,y); ctx.stroke();
  }

  ctx.fillStyle='#222'; ctx.font='500 12px sans-serif'; ctx.textAlign='center';
  ctx.fillText('Level of Words', pad.left+pw/2, H-10);
  ctx.save(); ctx.translate(13,pad.top+ph/2); ctx.rotate(-Math.PI/2);
  ctx.fillText('Word Count', 0, 0); ctx.restore();

  ctx.fillStyle='#111'; ctx.font='600 13px sans-serif'; ctx.textAlign='center';
  ctx.fillText('Word Count by Level', pad.left+pw/2, pad.top-16);
}

function switchTab(id) {
  const labels = {breakdown:'Level breakdown', chart:'ggplot chart', annotated:'Annotated text', words:'Word list'};
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent===labels[id]));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  if (id==='chart' && lastAnalysis) {
    const allKeys=[...lastAnalysis.levels,'__extra__'];
    const allLabels=[...lastAnalysis.levels.map(l=>`Level ${l.replace(/level\s*/i,'')||l}`),'Extracurricular'];
    const activeCounts={};
    allKeys.forEach(k => activeCounts[k]=disabledLevels.has(k)?0:(lastAnalysis.levelCounts[k]||0));
    setTimeout(()=>drawGGPlot(allKeys,allLabels,activeCounts),30);
  }
}

// ── Exports ───────────────────────────────────────────────────────
function buildPlainText() {
  if (!lastAnalysis) return '';
  const allKeys=[...lastAnalysis.levels,'__extra__'];
  const allLabels=[...lastAnalysis.levels.map(l=>`Level ${l.replace(/level\s*/i,'')||l}`),'Extracurricular'];
  // rebuild byLevel
  const byLevel={}; allKeys.forEach(k=>byLevel[k]=new Map());
  lastAnalysis.tokenInfo.filter(t=>t.isWord&&t.level).forEach(t=>{if(!byLevel[t.level].has(t.lemma))byLevel[t.level].set(t.lemma,t.translation);});
  let out='';
  allKeys.forEach((key,i)=>{
    const map=byLevel[key]; if(!map||!map.size) return;
    out+=`=== ${allLabels[i]} (${map.size} words) ===\n`;
    [...map.keys()].sort().forEach(w=>out+=`${lemmaDisplay(w)}${map.get(w)?' — '+map.get(w):''}\n`);
    out+='\n';
  });
  return out.trim();
}

function buildCSVWords() {
  if (!lastAnalysis) return '';
  const allKeys=[...lastAnalysis.levels,'__extra__'];
  const allLabels=[...lastAnalysis.levels.map(l=>`Level ${l.replace(/level\s*/i,'')||l}`),'Extracurricular'];
  const byLevel={}; allKeys.forEach(k=>byLevel[k]=new Map());
  lastAnalysis.tokenInfo.filter(t=>t.isWord&&t.level).forEach(t=>{if(!byLevel[t.level].has(t.lemma))byLevel[t.level].set(t.lemma,t.translation);});
  let rows='Level,Word,Translation\n';
  allKeys.forEach((key,i)=>{
    const map=byLevel[key]; if(!map||!map.size) return;
    [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0])).forEach(([w,t])=>{
      rows+=`"${allLabels[i]}","${lemmaDisplay(w)}","${t||''}"\n`;
    });
  });
  return rows;
}

function toast(msg) {
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}
function exportTXT() { navigator.clipboard.writeText(buildPlainText()).then(()=>toast('Copied to clipboard!')).catch(()=>toast('Copy failed')); }
function exportCSVWords() {
  const b=new Blob([buildCSVWords()],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='word_list.csv'; a.click();
  toast('CSV downloaded!');
}
